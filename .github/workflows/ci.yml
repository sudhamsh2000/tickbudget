name: CI

on:
  push:
  pull_request:

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    env:
      DOTNET_NOLOGO: true
      DOTNET_CLI_TELEMETRY_OPTOUT: true
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Restore
        run: dotnet restore TickBudget.slnx

      - name: Build (Release)
        run: dotnet build TickBudget.slnx -c Release --no-restore

      - name: Test
        run: dotnet test TickBudget.slnx -c Release --no-build --verbosity normal
